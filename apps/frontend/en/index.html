<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#20242c" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A clear, accessible timetable for Turku UAS students." />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>TAHTI</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("tahti-appearance") || "system";
          const dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const resolved = saved === "system" ? (dark ? "dark" : "light") : saved;
          document.documentElement.dataset.appearance = resolved === "light" ? "light" : "dark";
          document.documentElement.style.colorScheme = resolved;
        } catch {
          document.documentElement.dataset.appearance = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
